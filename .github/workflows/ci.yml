name: ci

on:
  push:
    branches: [main]
  pull_request:

# Só conferências rápidas: nada de npm install, Chromium, render ou chamada a API paga.
jobs:
  sintaxe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Sintaxe (JS, Python, shell), JSON, imports contra o package.json, arquivos que os filmes de exemplo
      # pedem (lib/3d, exemplos/bancada), peças da versão 2 e caminhos locais ou chaves esquecidos em texto.
      - name: conferência do repositório (o mesmo que make sintaxe)
        run: node scripts/checar_sintaxe.mjs

      # As três etapas abaixo repetem a sintaxe incluindo a pasta vendor/, que o script acima pula.
      - name: node --check em todo .js e .mjs
        run: |
          find . -type f \( -name '*.js' -o -name '*.mjs' \) \
            -not -path './node_modules/*' -not -path './out/*' -print0 \
            | xargs -0 -n1 node --check

      - name: python -m py_compile em todo .py
        run: |
          find . -type f -name '*.py' -not -path './node_modules/*' -not -path './out/*' -print0 \
            | xargs -0 python -m py_compile

      - name: JSON válido
        run: |
          find . -type f -name '*.json' -not -path './node_modules/*' -not -path './out/*' -print0 \
            | xargs -0 -n1 python -m json.tool > /dev/null

      # A voz dirigida monta as requisições a partir do modelo de roteiro e só imprime: não precisa de chave
      # nem gasta crédito. Se o formato de templates/roteiro.json quebrar, esta etapa avisa.
      - name: voz dirigida em --dry-run (não chama a API)
        run: |
          python scripts/voz_dirigida.py --help > /dev/null
          python scripts/voz_dirigida.py amostras VOZ ci --id c02-voz-dirigida --roteiros templates/roteiro.json --dry-run
          python scripts/voz_dirigida.py bloco c02-voz-dirigida f1 ci --so-voz f1 --tomadas 2 --roteiros templates/roteiro.json --dry-run
          python scripts/voz_dirigida.py dialogo c02-voz-dirigida ci --tomadas 1 --roteiros templates/roteiro.json --dry-run

      - name: ajuda dos atalhos (Makefile e scripts de finalização)
        run: |
          make ajuda
          bash scripts/finalizar.sh --help > /dev/null
          bash scripts/finalizar3d.sh --help > /dev/null

      - name: shellcheck (informativo, não bloqueia)
        continue-on-error: true
        run: |
          sudo apt-get install -y shellcheck >/dev/null 2>&1 || true
          find . -type f -name '*.sh' -not -path './node_modules/*' -print0 | xargs -0 shellcheck -S warning
