<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>__TITLE__</title>
<style>
  /* Duas famílias: uma de display (títulos) e uma de interface. Variáveis (peso 100 a 900), licença SIL OFL. */
  @font-face { font-family: Display; src: url(../../lib/fonts/urbanist.woff2) format('woff2'); font-weight: 100 900; }
  @font-face { font-family: UI; src: url(../../lib/fonts/inter.woff2) format('woff2'); font-weight: 100 900; }
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  body { display: grid; place-items: center; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; width: auto; height: auto; }
  #hud { position: fixed; left: 12px; bottom: 10px; font: 12px/1 ui-monospace, monospace; color: #888; }
  .render #hud { display: none; }
</style>
</head>
<body>
<canvas id="film"></canvas>
<div id="hud">espaço: tocar/pausar · ←/→: quadro a quadro · clique: navegar · ?format=9x16</div>

</html>
