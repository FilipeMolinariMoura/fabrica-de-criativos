<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>A bancada · Fábrica de Criativos</title>
<style>
  /* duas famílias: Geist (+ Geist Mono em código e rótulos) e Instrument Serif itálico na palavra de acento */
  @font-face { font-family: Sans; src: url(../../lib/3d/assets/fonts/Geist.ttf) format('truetype'); font-weight: 100 900; }
  @font-face { font-family: Mono; src: url(../../lib/3d/assets/fonts/GeistMono.ttf) format('truetype'); font-weight: 100 900; }
  @font-face { font-family: Serif; src: url(../../lib/3d/assets/fonts/InstrumentSerif-Italic.ttf) format('truetype'); font-style: italic; font-weight: 400; }
  @font-face { font-family: Chrome; src: url(../../lib/fonts/inter.woff2) format('woff2'); font-weight: 100 900; }
  html, body { margin: 0; height: 100%; background: #050809; overflow: hidden; }
  body { display: grid; place-items: center; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; width: auto; height: auto; }
  .render canvas { max-width: none; max-height: none; }
  body.render { display: block; }
  #hud { position: fixed; left: 12px; bottom: 10px; font: 12px/1 ui-monospace, monospace; color: #888; }
  .render #hud { display: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/addons/": "/node_modules/three/examples/jsm/"
} }
</script>
<script>
  // acabamento: 'motor' = grão, vinheta, halação e aberração feitos no render; 'limpo' = master limpo para grade externa
  window.ACABAMENTO = 'motor';
</script>
</head>
<body>
<canvas id="film"></canvas>
<div id="hud"></div>
<script type="module" src="film.js"></script>
</body>
</html>
